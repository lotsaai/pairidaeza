[package]
name = "pairidaeza-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
axum-login = "0.18"
base64 = "0.22"
confique = { version = "0.4", features = ["toml"] }
dashmap = "6"
dirs = "7"
eyre = "0.6"
fs2 = "0.4"
futures = "0.3"
hmac = "0.12"
http-body-util = "0.1"
init-tracing-opentelemetry = { version = "0.38", features = ["otlp", "tracer", "stdout", "tracing_subscriber_ext"] }
jcode-sdk = { git = "https://github.com/1jehuang/jcode", rev = "bc06755d155c2719b4cc7ac75fb0cbfeaaa9d209" }
jiff = "0.2"
jsonrpsee = { version = "0.26", features = ["server", "ws-client"] }
jsonwebtoken = "9"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "http2", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
