---
name: CI

"on":
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  FNOX_NON_INTERACTIVE: "true"
  FNOX_IF_MISSING: error

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Write test credentials
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          {
            echo '[secrets]'
            for name in TEST_USER TEST_USER_EMAIL TEST_PASSWORD; do
              jq -rn --arg n "$name" \
                '"\($n) = { default = \(env[$n] | tojson) }"'
            done
          } > fnox.local.toml
      - run: mise verify
      - name: Remove test credentials
        if: always()
        run: rm -f fnox.local.toml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev libgtk-4-dev \
            libwebkitgtk-6.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev xvfb xauth
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Start database
        run: |
          docker compose up -d --wait postgres
          DATABASE_URL="$PAIRIDAEZA_DATABASE_URL" sqlx database create
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write test credentials
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          {
            echo '[secrets]'
            for name in TEST_USER TEST_USER_EMAIL TEST_PASSWORD; do
              jq -rn --arg n "$name" \
                '"\($n) = { default = \(env[$n] | tojson) }"'
            done
          } > fnox.local.toml
      - run: xvfb-run -a mise verify
      - name: Remove test credentials
        if: always()
        run: rm -f fnox.local.toml
