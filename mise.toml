redactions = ["*_TOKEN", "*_SECRET", "*_KEY", "*_PASSWORD"]
min_version = "2026.10.4"

[settings]
experimental = true
lockfile = true
env_shell_expand = true
npm.package_manager = "bun"
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "create|source"

[tools]
worktrunk = { version = "latest", workflow = "release.yaml" }
"npm:oxfmt" = "latest"
"github:1jehuang/jcode" = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
chromedriver = "157"
pitchfork = { version = "latest", workflow = "release.yml@refs/heads/main" }
"github:longbridge/nsh" = { version = "latest", minimum_release_age = "5m" }
"cargo:cargo-sort" = "latest"
hk = "latest"
node = "24"
bun = "latest"
betterleaks = "latest"
pkl = "latest"
fnox = "latest"
taplo = "latest"
shellcheck = "latest"
cargo-binstall = "latest"
rust = { version = "latest", profile = "default", components = "llvm-tools,rust-analyzer", targets = "aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown" }
"cargo:cargo-hakari" = "latest"
uv = "latest"
python = "3.14"
watchexec = "latest"
shfmt = "latest"
zig = "latest"
"cargo:docsrs-mcp" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
"cargo:sqlx-cli" = "latest"

[secrets.fnox]

[daemons.api]
task = "dev:api"
ready_cmd = 'curl --fail --silent "http://${PAIRIDAEZA_ADDR:-127.0.0.1:17810}/healthz"'
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/pairidaezad/**",
  "crates/protocol/**",
  "crates/telemetry/**",
  ".mise/tasks/dev/api",
  ".mise/tasks/build/**",
]

[daemons.webui]
task = "dev:web"
depends = ["api"]
ready_cmd = 'curl --fail --silent "http://${PAIRIDAEZA_WEB_ADDR:-127.0.0.1:17811}/healthz"'
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/webui/**",
  "crates/telemetry/**",
  "crates/app/**",
  "*.ts",
  "*.tsx",
  "pages/**",
  "components/**",
  "icons/**",
  "fonts/**",
  "theme.json",
  "nsh.json",
  ".mise/tasks/dev/web",
  ".mise/tasks/build/**",
  ".mise/tasks/dist/web",
]

[daemons.webdriver]
task = "dev:webdriver"
ready_cmd = 'curl --fail --silent http://127.0.0.1:17812/status'


[env]
PAIRIDAEZA_ADDR = "127.0.0.1:17810"
PAIRIDAEZA_API_URL = "http://127.0.0.1:17810"
PAIRIDAEZA_WEB_ADDR = "127.0.0.1:17811"
PAIRIDAEZA_WEB_URL = "http://127.0.0.1:17811"
PAIRIDAEZA_WEB_ORIGIN = "http://127.0.0.1:17811"
PAIRIDAEZA_DATABASE_URL = "postgres://postgres@localhost:5432/pairidaeza_dev"
PAIRIDAEZA_AUTH__ISSUER = "https://auth.lotsa.ai"
PAIRIDAEZA_AUTH__CLIENT_ID = "399106586653524654"
PAIRIDAEZA_AUTH__NATIVE_CLIENT_ID = "399234353625923915"
PAIRIDAEZA_AUTH__PROJECT_ID = "399106433292993198"
PAIRIDAEZA_AUTH__REDIRECT_URI = "http://127.0.0.1:17811/auth/zitadel/callback"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://127.0.0.1:4318"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
